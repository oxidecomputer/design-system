name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 6.0.2)'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write # to add the canary version to the PR description
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build

      - name: Publish canary
        id: canary
        run: |
          SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="$(node -p "require('./package.json').version")-canary.${SHA}"
          npm version "$CANARY_VERSION" --no-git-tag-version
          npm publish --provenance --access public --tag canary
          echo "version=$CANARY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update PR description with canary version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
          CANARY_LINE="**Canary:** \`npm install @oxide/design-system@${CANARY_VERSION}\`"
          if echo "$CURRENT_BODY" | grep -q '^\*\*Canary:\*\*'; then
            UPDATED_BODY=$(echo "$CURRENT_BODY" | sed "s|^\*\*Canary:\*\*.*|${CANARY_LINE}|")
          else
            UPDATED_BODY="${CURRENT_BODY}"$'\n\n'"${CANARY_LINE}"
          fi
          gh pr edit "$PR_NUMBER" --body "$UPDATED_BODY"

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # to push the version bump commit and tag, and create the release
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build

      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v${{ inputs.version }} [skip ci]"
          git tag "v${{ inputs.version }}"
          git push origin master --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --generate-notes
