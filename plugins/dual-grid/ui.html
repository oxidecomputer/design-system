<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Accessing localStorage throws in Figma's originless iframe.
      // Install the shim before any other scripts run.
      ;(function () {
        try {
          window.localStorage.getItem('probe')
          return
        } catch (e) {}
        var store = {}
        var shim = {
          getItem: function (k) {
            return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null
          },
          setItem: function (k, v) {
            store[k] = String(v)
          },
          removeItem: function (k) {
            delete store[k]
          },
          clear: function () {
            store = {}
          },
          key: function (i) {
            return Object.keys(store)[i] || null
          },
        }
        Object.defineProperty(shim, 'length', {
          get: function () {
            return Object.keys(store).length
          },
        })
        try {
          Object.defineProperty(window, 'localStorage', {
            value: shim,
            configurable: true,
          })
        } catch (e) {
          window.localStorage = shim
        }
      })()
    </script>
    <!-- FigUI3's stylesheet and components, inlined here by scripts/inline-ui.mjs.
         They read Figma's --figma-color-* variables and its figma-dark class,
         so the panel follows the Figma theme. -->
    <!-- figui3 -->
    <style>
      /* Only what FigUI3 doesn't provide: the panel's own readouts, the nested
         field elbow, the size pairs, and the specimen table. */
      :root {
        --dg-dim: var(--figma-color-text-secondary);
        --dg-warn: var(--figma-color-text-danger, #f24822);
        --dg-rule: var(--figma-color-border);
      }
      html,
      body {
        margin: 0;
        background: var(--figma-color-bg);
      }

      fig-field[hidden],
      fig-group[hidden],
      [hidden] {
        display: none !important;
      }

      /* A group inside a group is a sub-section: every one gets the divider
         above it (FigUI3 draws it only between sibling groups), and a quieter
         title than its parent so the two levels read apart. */
      fig-group fig-group {
        box-shadow: inset 0 1px 0 0 var(--dg-rule);
        margin-top: var(--spacer-2);
        padding-bottom: 0;
      }
      fig-group fig-group > fig-header > h3 {
        color: var(--dg-dim);
      }

      /* Values the settings produce, read only. */
      .readout {
        font-variant-numeric: tabular-nums;
        align-self: center;
        min-width: 0;
      }
      .dim {
        color: var(--dg-dim);
      }
      .warn {
        color: var(--dg-warn);
      }

      /* A field that only applies while the one above it is on or set: an elbow
         in the field's left gutter and an indented label tie it to that field.
         The input column doesn't move, so values still line up. */
      fig-field[nested] {
        position: relative;
      }
      fig-field[nested] > label {
        padding-left: 10px;
      }
      fig-field[nested]::before {
        content: '';
        position: absolute;
        left: calc(var(--fig-field-left-padding) + 3px);
        top: -2px;
        width: 5px;
        height: calc(50% + 2px);
        border-left: 1px solid var(--dg-rule);
        border-bottom: 1px solid var(--dg-rule);
        border-bottom-left-radius: 3px;
      }

      /* Two numbers for a family's ends: smallest – largest. A single step has
         only one end, so the second number and the dash go. */
      .pair {
        display: flex;
        align-items: center;
        gap: var(--spacer-1);
        min-width: 0;
      }
      .pair > fig-input-number {
        flex: 1;
        min-width: 0;
      }
      .pair > .sep {
        flex: none;
        color: var(--dg-dim);
      }
      .pair.single > .end {
        display: none;
      }

      /* The specimens as set: size, font px, line height in cells, leading,
         tracking. Read only, inset to line up with the fields. */
      .spec-table {
        display: grid;
        grid-template-columns: 40px 1fr 34px 40px 40px;
        column-gap: 6px;
        row-gap: 2px;
        margin: var(--spacer-1) var(--spacer-3) var(--spacer-2);
        font-variant-numeric: tabular-nums;
      }
      .spec-table:empty {
        display: none;
      }
      .spec-table > span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .spec-table > span:nth-child(5n + 3),
      .spec-table > span:nth-child(5n + 4),
      .spec-table > span:nth-child(5n + 5) {
        text-align: right;
      }
      .spec-table > .head {
        color: var(--dg-dim);
      }

      /* The action's status sits beside its buttons. */
      #action-status {
        color: var(--dg-dim);
      }
      #action-status:empty {
        visibility: hidden;
      }

      /* Staging textarea for the legacy copy command. Kept out of the measured
         layout so copying never resizes the panel. */
      .clipboard-stage {
        position: fixed;
        top: -100px;
        left: 0;
        width: 10px;
        height: 10px;
        opacity: 0;
      }

      /* The grid controls apply live to a gridded frame and nothing else, so
         they're hidden until one is selected. Create frame and Apply grids use
         the settings last used. */
      #plugin-root:not([data-live]) fig-content > fig-group:not([name='Frame']),
      #plugin-root:not([data-live]) #copy-mitos {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="plugin-root">
      <fig-content>
        <fig-group name="Grid">
          <fig-field>
            <label>Mode</label>
            <fig-segmented-control id="mode" value="Manual" full>
              <fig-segment value="Manual" selected>Manual</fig-segment>
              <fig-segment value="Solve">Solve</fig-segment>
            </fig-segmented-control>
          </fig-field>
          <fig-field>
            <label>Columns</label>
            <fig-dropdown id="columnCount" value="12" full>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>6</option>
              <option>9</option>
              <option selected>12</option>
            </fig-dropdown>
          </fig-field>
          <fig-field id="marginField" data-mode="Manual">
            <label>Margin cells</label>
            <fig-slider
              id="marginCells"
              min="0"
              max="24"
              step="1"
              value="3"
              full
            ></fig-slider>
          </fig-field>
          <!-- Shown only in Manual with Asym. margin (under Advanced) on;
               Margin cells then sets the left side. -->
          <fig-field id="marginRightField" nested hidden>
            <label>Right</label>
            <fig-slider
              id="marginRightCells"
              min="0"
              max="24"
              step="1"
              value="3"
              full
            ></fig-slider>
          </fig-field>
          <fig-field data-mode="Manual">
            <label>Gutter cells</label>
            <fig-slider
              id="gutterMultiple"
              min="1"
              max="6"
              step="1"
              value="1"
              full
            ></fig-slider>
          </fig-field>
          <fig-field data-mode="Solve">
            <label>Margin</label>
            <fig-input-number id="targetMarginPx" value="50" min="0" units="px" full>
            </fig-input-number>
          </fig-field>
          <fig-field data-mode="Solve">
            <label>Gutter</label>
            <fig-input-number id="targetGutterPx" value="20" min="1" units="px" full>
            </fig-input-number>
          </fig-field>
          <!-- The reachable counts, which the plugin sends with each state update. -->
          <fig-field data-mode="Manual">
            <label>Cell columns</label>
            <fig-dropdown id="cellColumns" value="89" full>
              <option>89</option>
            </fig-dropdown>
          </fig-field>
          <!-- Target cell count, matching the quantity chosen in Manual. -->
          <fig-field data-mode="Solve">
            <label>Cell columns</label>
            <fig-input-number id="targetColumns" value="89" min="1" step="1" full>
            </fig-input-number>
          </fig-field>
          <fig-field>
            <label>Snap rows</label>
            <fig-switch id="snapRows" checked></fig-switch>
          </fig-field>
          <fig-field>
            <label>Pixel snap</label>
            <fig-switch id="pixelPerfect"></fig-switch>
          </fig-field>
          <!-- Pixel-rounding tolerance per cell, shown only with Pixel snap on.
               0 disables snapping; 0.5 always snaps. -->
          <fig-field id="snapTolField" nested hidden>
            <label>Snap tol.</label>
            <fig-input-number
              id="snapTolerancePx"
              value="0.5"
              min="0"
              max="0.5"
              step="0.05"
              units="px"
              full
            ></fig-input-number>
          </fig-field>
          <!-- With Snap rows on, the row count may move within this share of
               the aspect target to land an integer row height (24 × 45 instead
               of 25 × 43.2 at 1920×1080 with Snap tol. 0.1). 0 keeps the
               natural row count. -->
          <fig-field id="aspectTolField" nested hidden>
            <label>Aspect tol.</label>
            <fig-input-number id="aspectTolPct" value="5" min="0" units="%" full>
            </fig-input-number>
          </fig-field>
          <!-- What the settings above produce. In Solve, a value the solver had
               to move away from its target is flagged. -->
          <fig-group name="Result">
            <fig-field>
              <label>Grid size</label>
              <span class="readout" id="preview-size">—</span>
            </fig-field>
            <!-- Labelled w×h to leave "Cell size" to the controls above. -->
            <fig-field>
              <label>Cell w×h</label>
              <span class="readout" id="preview-cell">—</span>
            </fig-field>
            <fig-field>
              <label>Column</label>
              <span class="readout" id="preview-column">—</span>
            </fig-field>
          </fig-group>
        </fig-group>

        <!-- Less frequently used controls and derived cell values. -->
        <fig-group name="Advanced" collapsible>
          <fig-field data-mode="Manual">
            <label>Asym. margin</label>
            <fig-switch id="asymmetricMargin"></fig-switch>
          </fig-field>
          <fig-group name="Cells">
            <fig-field>
              <label>Aspect ratio</label>
              <fig-slider
                id="cellAspect"
                min="1"
                max="4"
                step="0.1"
                value="2"
                full
              ></fig-slider>
            </fig-field>
            <fig-field>
              <label>Cell density</label>
              <fig-dropdown id="cellDensity" value="1x" full>
                <option>0.25x</option>
                <option>0.5x</option>
                <option selected>1x</option>
                <option>2x</option>
                <option>3x</option>
              </fig-dropdown>
            </fig-field>
            <fig-field>
              <label>Cells</label>
              <span class="readout" id="preview-solved">—</span>
            </fig-field>
          </fig-group>
          <fig-group name="Lines">
            <fig-field>
              <label>Grid lines</label>
              <fig-switch id="showLines" checked></fig-switch>
            </fig-field>
            <!-- Cull interior lines near the frame edge. Lines on or beyond the
                 boundary are always culled. -->
            <fig-field>
              <label>Edge cull</label>
              <fig-switch id="edgeCull" checked></fig-switch>
            </fig-field>
            <!-- Culling distance from the boundary, as a percentage of line spacing. -->
            <fig-field id="edgeCullPctField" nested>
              <label>Cull tol.</label>
              <fig-input-number
                id="edgeCullPct"
                value="20"
                min="0"
                max="100"
                units="%"
                full
              >
              </fig-input-number>
            </fig-field>
          </fig-group>
        </fig-group>

        <!-- Each family is a scale from its smallest to its largest size in
             equal ratio steps, sized as % of the frame height. Leading and
             tracking follow the design system's type scale at the size the
             type is seen, so they have no settings; the table shows what each
             step is set at. -->
        <fig-group name="Type" collapsible>
          <fig-field>
            <label>Specimens</label>
            <fig-switch id="showSpecimens" checked></fig-switch>
          </fig-field>
          <div id="typeBody">
            <!-- Rounds font sizes only; line heights stay on cell steps. -->
            <fig-field nested>
              <label>Whole px</label>
              <fig-switch id="snapFontPx"></fig-switch>
            </fig-field>
            <!-- Family only; the style is resolved per family, since a family's
                 regular is not reliably named "Regular". Both fall back to any
                 installed mono / any regular. -->
            <fig-group name="Mono" data-face="mono">
              <fig-field>
                <label>Font</label>
                <fig-input-text
                  id="monoFamily"
                  value="GT America Mono"
                  full
                ></fig-input-text>
              </fig-field>
              <fig-field>
                <label>Size</label>
                <div class="pair" id="monoSizeRange">
                  <fig-input-number
                    id="monoSizeMin"
                    value="2"
                    min="0.5"
                    max="100"
                    units="%"
                    steppers="false"
                    aria-label="Mono smallest size, % of frame height"
                  ></fig-input-number>
                  <span class="sep end">–</span>
                  <fig-input-number
                    class="end"
                    id="monoSizeMax"
                    value="12"
                    min="0.5"
                    max="100"
                    units="%"
                    steppers="false"
                    aria-label="Mono largest size, % of frame height"
                  ></fig-input-number>
                </div>
              </fig-field>
              <fig-field>
                <label>Steps</label>
                <fig-slider
                  id="monoSteps"
                  min="1"
                  max="8"
                  step="1"
                  value="1"
                  full
                ></fig-slider>
              </fig-field>
              <div class="spec-table" id="monoSpecs"></div>
            </fig-group>
            <fig-group name="Sans" data-face="sans">
              <fig-field>
                <label>Font</label>
                <fig-input-text id="sansFamily" value="Suisse Int'l" full></fig-input-text>
              </fig-field>
              <fig-field>
                <label>Sizes</label>
                <div class="pair" id="sansSizeRange">
                  <fig-input-number
                    id="sansSizeMin"
                    value="6"
                    min="0.5"
                    max="100"
                    units="%"
                    steppers="false"
                    aria-label="Sans smallest size, % of frame height"
                  ></fig-input-number>
                  <span class="sep end">–</span>
                  <fig-input-number
                    class="end"
                    id="sansSizeMax"
                    value="24"
                    min="0.5"
                    max="100"
                    units="%"
                    steppers="false"
                    aria-label="Sans largest size, % of frame height"
                  ></fig-input-number>
                </div>
              </fig-field>
              <fig-field>
                <label>Steps</label>
                <fig-slider
                  id="sansSteps"
                  min="1"
                  max="8"
                  step="1"
                  value="3"
                  full
                ></fig-slider>
              </fig-field>
              <div class="spec-table" id="sansSpecs"></div>
            </fig-group>
            <!-- Leading and tracking are read at the size the type is seen: on
                 the frame's own screen, at a width it is shown at, or for
                 print from the physical width and viewing distance. -->
            <fig-group name="Viewing" id="opticalSection">
              <fig-field>
                <label>Seen on</label>
                <fig-dropdown id="displayMode" value="Screen" full>
                  <option selected>Screen</option>
                  <option>Print</option>
                  <option>Custom</option>
                </fig-dropdown>
              </fig-field>
              <fig-field id="shownWidthField" nested hidden>
                <label>Shown width</label>
                <fig-input-number id="shownWidthPx" value="400" min="1" units="px" full>
                </fig-input-number>
              </fig-field>
              <fig-field id="printWidthField" nested hidden>
                <label>Print width</label>
                <fig-input-number id="printWidthMm" value="210" min="1" units="mm" full>
                </fig-input-number>
              </fig-field>
              <fig-field id="viewingDistanceField" nested hidden>
                <label>Distance</label>
                <fig-input-number id="viewingDistanceCm" value="40" min="1" units="cm" full>
                </fig-input-number>
              </fig-field>
              <fig-field>
                <label>Reads as</label>
                <span class="readout" id="preview-display">—</span>
              </fig-field>
            </fig-group>
          </div>
        </fig-group>

        <!-- Describes the frame that "Create frame" would make — or, when one
             is selected, the frame itself, mirrored read-only. -->
        <fig-group name="Frame">
          <fig-field>
            <label>Aspect</label>
            <fig-dropdown id="frameAspect" value="16:9" full>
              <option selected>16:9</option>
              <option>4:3</option>
              <option>1:1</option>
              <option>9:16</option>
              <option>Custom</option>
            </fig-dropdown>
          </fig-field>
          <fig-field>
            <label>Width</label>
            <fig-input-number id="frameWidth" value="1920" min="1" units="px" full>
            </fig-input-number>
          </fig-field>
          <!-- Only meaningful when the aspect is Custom; otherwise the height is
               derived, and shown only to mirror a selection. -->
          <fig-field id="frameHeightField" hidden>
            <label>Height</label>
            <fig-input-number id="frameHeight" value="1080" min="1" units="px" full>
            </fig-input-number>
          </fig-field>
        </fig-group>
      </fig-content>

      <!-- The plugin sets the action and label from the current selection. The
           status is a plain label: it isn't for the button, so clicking it does
           nothing. -->
      <fig-footer sticky>
        <label id="action-status" aria-live="polite"></label>
        <!-- Copies the previewed grid as the partial-settings JSON that Mitos
             accepts on paste, so its ASCII canvas picks up the same columns,
             rows, cell shape and export size. -->
        <fig-button id="copy-mitos" variant="secondary">Copy config</fig-button>
        <fig-button id="action-primary">Create frame</fig-button>
      </fig-footer>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)

      // ----- reading and writing FigUI3 controls ----------------------------
      // Sliders, number inputs and dropdowns report their value as a string
      // (a number input reports '' when empty); the plugin wants numbers.
      const num = (id) => Number($(id).value)
      // Setting the value attribute is the one way every FigUI3 control takes a
      // new value without treating it as an edit: a number input ignores a
      // value assigned as a property.
      function setValue(id, value) {
        $(id).setAttribute(
          'value',
          value === null || value === undefined ? '' : String(value),
        )
      }
      function setChecked(id, on) {
        $(id).checked = !!on
      }
      function setDisabled(id, off) {
        $(id).toggleAttribute('disabled', !!off)
      }
      // The field's label element, for the fields whose label changes.
      const labelOf = (id) => $(id).closest('fig-field').querySelector(':scope > label')

      // The snap and aspect tolerances only mean anything while Pixel snap is
      // on, so the fields appear underneath the switch only then.
      function applySnapTol() {
        const off = !$('pixelPerfect').checked
        $('snapTolField').hidden = off
        $('aspectTolField').hidden = off
        reportHeight()
      }

      // Same pattern for the cull tolerance under the Edge cull switch.
      function applyEdgeCull() {
        $('edgeCullPctField').hidden = !$('edgeCull').checked
        reportHeight()
      }

      // The right margin only applies in Manual with the switch on, and the
      // first margin field then reads as the left side.
      function applyAsymMargin() {
        const on = $('asymmetricMargin').checked
        $('marginRightField').hidden = !on || $('mode').value !== 'Manual'
        labelOf('marginCells').textContent = on ? 'Left margin' : 'Margin cells'
        reportHeight()
      }

      // Custom asks for the shown width; Print for the printed width and the
      // distance it is read from. The presets need neither.
      function applyDisplayMode() {
        const mode = $('displayMode').value
        $('shownWidthField').hidden = mode !== 'Custom'
        $('printWidthField').hidden = mode !== 'Print'
        $('viewingDistanceField').hidden = mode !== 'Print'
        reportHeight()
      }

      // ----- type scales -----------------------------------------------------
      // Each family is set by its smallest and largest size and a step count;
      // the sizes between go up by a constant ratio. The plugin takes the
      // result as a size list. A list loaded from a frame is passed back
      // unchanged until one of these controls is edited, so selecting a frame
      // never rewrites its sizes.
      const FACES = ['mono', 'sans']
      const SIZE_LIMITS = [0.5, 100]
      const loadedSizes = { mono: null, sans: null }
      let lastSpecimens = []

      const round = (n, places) => Math.round(n * 10 ** places) / 10 ** places

      function numberIn(text, limits) {
        const t = String(text).trim()
        const n = Number(t)
        return t !== '' && Number.isFinite(n) && n >= limits[0] && n <= limits[1] ? n : null
      }

      // The equal-ratio scale between the two ends. The ends stay exactly as
      // set; the steps between round to 0.1%.
      function scaleSizes(face) {
        const a = numberIn($(face + 'SizeMin').value, SIZE_LIMITS)
        const b = numberIn($(face + 'SizeMax').value, SIZE_LIMITS)
        const steps = num(face + 'Steps')
        if (a === null) return []
        if (steps === 1 || b === null || a === b) return [a]
        const lo = Math.min(a, b)
        const hi = Math.max(a, b)
        const out = []
        for (let i = 0; i < steps; i++) {
          const pct =
            i === 0
              ? lo
              : i === steps - 1
                ? hi
                : round(lo * (hi / lo) ** (i / (steps - 1)), 1)
          if (out.indexOf(pct) < 0) out.push(pct)
        }
        return out
      }

      function sizesParam(face) {
        return loadedSizes[face] !== null ? loadedSizes[face] : scaleSizes(face).join(', ')
      }

      // Parses a stored size list the way the plugin does, so the controls
      // describe what is drawn.
      function parseSizes(raw) {
        const seen = []
        String(raw || '')
          .split(/[,\s]+/)
          .map((t) => numberIn(t.replace('%', ''), SIZE_LIMITS))
          .forEach((n) => {
            if (n !== null && seen.indexOf(n) < 0) seen.push(n)
          })
        return seen.sort((x, y) => x - y).slice(0, 8)
      }

      function loadScale(face, raw, fallback) {
        let sizes = parseSizes(raw)
        loadedSizes[face] = sizes.length ? String(raw) : null
        if (!sizes.length) sizes = parseSizes(fallback)
        setValue(face + 'SizeMin', sizes[0])
        setValue(face + 'SizeMax', sizes[sizes.length - 1])
        setValue(face + 'Steps', sizes.length)
        // Remember nothing if the list is just the scale the controls make.
        if (scaleSizes(face).join(', ') === sizes.join(', ')) loadedSizes[face] = null
        applyScaleShape(face)
      }

      // One step has one size, so the second size and the dash go.
      function applyScaleShape(face) {
        const single = num(face + 'Steps') === 1
        $(face + 'SizeRange').classList.toggle('single', single)
        labelOf(face + 'SizeRange').textContent = single ? 'Size' : 'Sizes'
        reportHeight()
      }

      FACES.forEach((face) => {
        ;['SizeMin', 'SizeMax', 'Steps'].forEach((k) => {
          $(face + k).addEventListener('input', () => {
            if (suppressChange) return
            loadedSizes[face] = null
            applyScaleShape(face)
          })
        })
      })

      // The table of what each step is set at. A step whose line height snaps
      // to the same number of cells as the one before is flagged: the two read
      // as nearly the same size.
      function renderScales() {
        FACES.forEach((face) => {
          const rows = lastSpecimens.filter((s) => s.face === face)
          const table = $(face + 'Specs')
          if (!rows.length) {
            table.innerHTML = ''
            return
          }
          const cell = (text, cls, title) =>
            '<span' +
            (cls ? ' class="' + cls + '"' : '') +
            (title ? ' title="' + title + '"' : '') +
            '>' +
            text +
            '</span>'
          let html = ['Size', 'Font', 'Cells', 'Lead', 'Track']
            .map((t) => cell(t, 'head'))
            .join('')
          rows.forEach((s, i) => {
            const clash = i > 0 && rows[i - 1].cells === s.cells
            html +=
              cell(round(s.pct, 1) + '<span class="dim">%</span>') +
              cell(round(s.size, 1) + '<span class="dim">px</span>') +
              cell(
                String(s.cells),
                clash ? 'warn' : '',
                clash ? 'Same line height as the step above' : '',
              ) +
              cell(s.leading.toFixed(2)) +
              cell(round(s.tracking, 1) + '<span class="dim">%</span>')
          })
          table.innerHTML = html
        })
        reportHeight()
      }

      function applyShowSpecimens() {
        $('typeBody').hidden = !$('showSpecimens').checked
        reportHeight()
      }

      // Shows only the controls that belong to the active mode.
      function applyMode() {
        const mode = $('mode').value
        document.querySelectorAll('fig-field[data-mode]').forEach((f) => {
          f.hidden = f.getAttribute('data-mode') !== mode
        })
        applyAsymMargin()
      }

      // Which action the primary button performs, set by the plugin.
      let currentAction = 'create'
      // An action is in flight from click until the plugin's next state arrives.
      let actionInFlight = false
      // When the button last changed to a different action. A second click of a
      // double-click landing just after the relabel must not run the new action.
      let actionChangedAt = 0
      const ACTION_SETTLE_MS = 400
      // The Manual cell column count the user asked for. The dropdown shows the
      // reachable count the plugin took, which can differ; sending the request
      // rather than that keeps the count from drifting as other settings change.
      let cellColumnsRequest = null
      // The last preview payload, kept so "Copy config" can serialise the grid
      // the panel is currently showing.
      let lastPreview = null
      let suppressChange = false

      // What the user set, as opposed to what is currently displayed. While a
      // frame is selected the three Frame fields mirror that frame and are
      // disabled, so these are kept aside and restored on deselection.
      let ownFrame = {
        frameWidth: 1920,
        frameAspect: '16:9',
        frameHeight: 1080,
      }
      // The selected frame's size, or null when nothing is bound.
      let mirrored = null

      const ASPECT_PRESETS = ['16:9', '4:3', '1:1', '9:16']

      // The preset a size corresponds to, or "Custom" if it matches none.
      function presetFor(width, height) {
        for (const preset of ASPECT_PRESETS) {
          const parts = preset.split(':')
          const ratio = Number(parts[0]) / Number(parts[1])
          if (Math.abs(width / height - ratio) < 0.005) return preset
        }
        return 'Custom'
      }

      // Writes either the mirrored frame or the user's own values into the
      // three fields, and sets their enabled state to match.
      function renderFrameFields() {
        const showing = mirrored
          ? {
              frameWidth: Math.round(mirrored.width),
              frameHeight: Math.round(mirrored.height),
              frameAspect: presetFor(mirrored.width, mirrored.height),
            }
          : ownFrame

        suppressChange = true
        setValue('frameWidth', showing.frameWidth)
        setValue('frameHeight', showing.frameHeight)
        setValue('frameAspect', showing.frameAspect)
        suppressChange = false

        for (const id of ['frameWidth', 'frameHeight', 'frameAspect']) {
          setDisabled(id, !!mirrored)
        }
        // The height is a real input only for a custom aspect; otherwise it is
        // derived, and worth showing only to describe a selected frame.
        $('frameHeightField').hidden = !mirrored && showing.frameAspect !== 'Custom'
        reportHeight()
      }

      function getPanelParams() {
        return {
          mode: $('mode').value,
          columnCount: num('columnCount'),
          marginCells: num('marginCells'),
          asymmetricMargin: $('asymmetricMargin').checked,
          marginRightCells: num('marginRightCells'),
          gutterMultiple: num('gutterMultiple'),
          targetMarginPx: num('targetMarginPx'),
          targetGutterPx: num('targetGutterPx'),
          targetColumns: num('targetColumns'),
          // The count asked for, not the one shown, so a change and its reverse
          // return to the same grid.
          cellColumns:
            cellColumnsRequest !== null ? cellColumnsRequest : num('cellColumns'),
          cellAspect: num('cellAspect'),
          snapRows: $('snapRows').checked,
          pixelPerfect: $('pixelPerfect').checked,
          snapTolerancePx: num('snapTolerancePx'),
          aspectTolPct: num('aspectTolPct'),
          edgeCull: $('edgeCull').checked,
          edgeCullPct: num('edgeCullPct'),
          // "2x" -> 2, "0.5x" -> 0.5 (parseFloat, since parseInt would read
          // "0.25x" as 0)
          cellDensity: parseFloat($('cellDensity').value) || 1,
          showLines: $('showLines').checked,
          showSpecimens: $('showSpecimens').checked,
          monoFamily: $('monoFamily').value,
          sansFamily: $('sansFamily').value,
          monoSizes: sizesParam('mono'),
          sansSizes: sizesParam('sans'),
          displayMode: $('displayMode').value,
          shownWidthPx: num('shownWidthPx'),
          printWidthMm: num('printWidthMm'),
          viewingDistanceCm: num('viewingDistanceCm'),
          snapFontPx: $('snapFontPx').checked,
          // Always the user's own settings, never the mirrored size of a
          // selected frame — those fields are read-only while a frame is bound,
          // so reading them back would overwrite what the next Create frame
          // should use.
          frameWidth: ownFrame.frameWidth,
          frameAspect: ownFrame.frameAspect,
          frameHeight: ownFrame.frameHeight,
        }
      }

      // Stored params can be missing fields, so fill anything absent rather
      // than writing undefined into a control (which would snap a slider to its
      // midpoint and clear a switch).
      const PARAM_DEFAULTS = {
        mode: 'Manual',
        columnCount: 12,
        marginCells: 3,
        asymmetricMargin: false,
        marginRightCells: 3,
        gutterMultiple: 1,
        targetMarginPx: 50,
        targetGutterPx: 20,
        cellColumns: 89,
        targetColumns: 89,
        cellAspect: 2,
        snapRows: true,
        pixelPerfect: false,
        snapTolerancePx: 0.5,
        aspectTolPct: 5,
        edgeCull: true,
        edgeCullPct: 20,
        cellDensity: 1,
        showLines: true,
        showSpecimens: true,
        monoFamily: 'GT America Mono',
        sansFamily: "Suisse Int'l",
        monoSizes: '2',
        sansSizes: '6, 12, 24',
        displayMode: 'Screen',
        shownWidthPx: 400,
        printWidthMm: 210,
        viewingDistanceCm: 40,
        snapFontPx: false,
        frameWidth: 1920,
        frameAspect: '16:9',
        frameHeight: 1080,
      }

      // The cell column dropdown lists the counts the grid can reach, which
      // change with the other settings. Keeps the shown value on the nearest
      // listed count.
      function setCellColumnOptions(counts, current) {
        const box = $('cellColumns')
        const now = [...box.querySelectorAll(':scope > option')].map((o) => Number(o.value))
        const same = now.length === counts.length && now.every((v, i) => v === counts[i])
        // Only the options are swapped: the dropdown keeps its own select
        // beside them.
        if (!same) {
          box.querySelectorAll(':scope > option').forEach((o) => o.remove())
          const select = box.querySelector(':scope > select')
          counts.forEach((c) => {
            const o = document.createElement('option')
            o.value = o.textContent = String(c)
            box.insertBefore(o, select)
          })
          // Rebuild its select now rather than on the slot's change event,
          // which comes later, so the value set below finds its option.
          box.slotChange()
        }
        let best = counts[0]
        counts.forEach((c) => {
          if (Math.abs(c - current) < Math.abs(best - current)) best = c
        })
        // The dropdown copies its options into its own select when they
        // change, so the chosen one is marked selected on the option itself
        // as well as set as the value.
        box.querySelectorAll(':scope > option').forEach((o) => {
          o.selected = Number(o.value) === best
          o.toggleAttribute('selected', Number(o.value) === best)
        })
        setValue('cellColumns', best)
      }

      function setPanelParams(raw) {
        const p = Object.assign({}, PARAM_DEFAULTS)
        for (const k in raw) {
          if (raw[k] !== undefined && raw[k] !== null) p[k] = raw[k]
        }
        suppressChange = true
        setValue('mode', p.mode)
        setValue('columnCount', p.columnCount)
        setValue('marginCells', p.marginCells)
        setChecked('asymmetricMargin', p.asymmetricMargin)
        setValue('marginRightCells', p.marginRightCells)
        setValue('gutterMultiple', p.gutterMultiple)
        setValue('targetMarginPx', p.targetMarginPx)
        setValue('targetGutterPx', p.targetGutterPx)
        cellColumnsRequest = Number(p.cellColumns)
        if (!$('cellColumns').querySelector('option[value="' + cellColumnsRequest + '"]')) {
          setCellColumnOptions([cellColumnsRequest], cellColumnsRequest)
        }
        setValue('cellColumns', p.cellColumns)
        setValue('targetColumns', p.targetColumns)
        setValue('cellAspect', p.cellAspect)
        setChecked('snapRows', p.snapRows)
        setChecked('pixelPerfect', p.pixelPerfect)
        setValue('snapTolerancePx', p.snapTolerancePx)
        setValue('aspectTolPct', p.aspectTolPct)
        setChecked('edgeCull', p.edgeCull)
        setValue('edgeCullPct', p.edgeCullPct)
        setValue('cellDensity', (p.cellDensity || 1) + 'x')
        setChecked('showLines', p.showLines)
        setChecked('showSpecimens', p.showSpecimens)
        setValue('monoFamily', p.monoFamily)
        setValue('sansFamily', p.sansFamily)
        loadScale('mono', p.monoSizes, PARAM_DEFAULTS.monoSizes)
        loadScale('sans', p.sansSizes, PARAM_DEFAULTS.sansSizes)
        setValue('displayMode', p.displayMode)
        setValue('shownWidthPx', p.shownWidthPx)
        setValue('printWidthMm', p.printWidthMm)
        setValue('viewingDistanceCm', p.viewingDistanceCm)
        setChecked('snapFontPx', p.snapFontPx)
        ownFrame = {
          frameWidth: p.frameWidth,
          frameAspect: p.frameAspect,
          frameHeight: p.frameHeight,
        }
        applyMode()
        applySnapTol()
        applyEdgeCull()
        applyShowSpecimens()
        applyDisplayMode()
        renderFrameFields()
        suppressChange = false
      }

      function post(message) {
        parent.postMessage({ pluginMessage: message }, '*')
      }

      // Preview on every input, but write to the document only when an
      // interaction is committed (FigUI3's change event: a slider released, a
      // field confirmed, an option picked), or after a pause in typing. That
      // keeps the undo history to one step per edit.
      const REAPPLY_DEBOUNCE_MS = 150
      let reapplyTimer = null

      function paramsChanged(reapply) {
        if (suppressChange) return
        post({
          type: 'params-changed',
          params: getPanelParams(),
          reapply: false,
        })
        if (!reapply) return
        if (reapplyTimer !== null) clearTimeout(reapplyTimer)
        reapplyTimer = setTimeout(flushReapply, REAPPLY_DEBOUNCE_MS)
      }

      function flushReapply() {
        if (reapplyTimer !== null) {
          clearTimeout(reapplyTimer)
          reapplyTimer = null
        }
        post({
          type: 'params-changed',
          params: getPanelParams(),
          reapply: true,
        })
      }

      // Closing the plugin tears the panel down without a change event, so
      // write anything still waiting in the debounce on the way out.
      const flushPending = () => {
        if (reapplyTimer !== null) flushReapply()
      }
      window.addEventListener('pagehide', flushPending)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushPending()
      })

      // Visibility follows the controls before the change is posted.
      $('mode').addEventListener('input', applyMode)
      $('pixelPerfect').addEventListener('input', applySnapTol)
      $('edgeCull').addEventListener('input', applyEdgeCull)
      $('displayMode').addEventListener('input', applyDisplayMode)
      $('showSpecimens').addEventListener('input', applyShowSpecimens)
      $('cellColumns').addEventListener('input', () => {
        if (!suppressChange) cellColumnsRequest = num('cellColumns')
      })
      $('asymmetricMargin').addEventListener('input', () => {
        if (suppressChange) return
        // Start the right margin where the left one is, so unlinking alone does
        // not move the grid.
        if ($('asymmetricMargin').checked) {
          setValue('marginRightCells', $('marginCells').value)
        }
        applyAsymMargin()
      })

      // Every control that reapplies live to a bound frame. The frame fields
      // are not here: they only feed Create frame.
      ;[
        'mode',
        'columnCount',
        'marginCells',
        'asymmetricMargin',
        'marginRightCells',
        'gutterMultiple',
        'targetMarginPx',
        'targetGutterPx',
        'targetColumns',
        'cellColumns',
        'cellAspect',
        'snapRows',
        'pixelPerfect',
        'snapTolerancePx',
        'aspectTolPct',
        'edgeCull',
        'edgeCullPct',
        'cellDensity',
        'showLines',
        'showSpecimens',
        'snapFontPx',
        'monoFamily',
        'sansFamily',
        'monoSizeMin',
        'monoSizeMax',
        'monoSteps',
        'sansSizeMin',
        'sansSizeMax',
        'sansSteps',
        'displayMode',
        'shownWidthPx',
        'printWidthMm',
        'viewingDistanceCm',
      ].forEach((id) => {
        $(id).addEventListener('input', () => paramsChanged(true))
        $(id).addEventListener('change', () => {
          if (suppressChange) return
          paramsChanged(true)
          flushReapply()
        })
      })

      // These only feed "Create frame", so they never reapply. They are also
      // the only fields that can be inert, so an edit while mirroring is
      // ignored rather than written back over the user's own settings.
      ;['frameWidth', 'frameHeight', 'frameAspect'].forEach((id) => {
        $(id).addEventListener('change', () => {
          if (mirrored || suppressChange) return
          // Switching to Custom starts from the height the preset gave, so the
          // frame does not change shape until the height is edited.
          if (
            id === 'frameAspect' &&
            $(id).value === 'Custom' &&
            ownFrame.frameAspect !== 'Custom'
          ) {
            const parts = String(ownFrame.frameAspect).split(':')
            const ratio = Number(parts[0]) / Number(parts[1])
            if (ratio > 0)
              ownFrame.frameHeight = Math.max(1, Math.round(ownFrame.frameWidth / ratio))
          }
          ownFrame[id] = id === 'frameAspect' ? $(id).value : num(id)
          if (id === 'frameAspect') renderFrameFields()
          paramsChanged(false)
        })
      })

      $('action-primary').addEventListener('click', () => {
        if (actionInFlight || Date.now() - actionChangedAt < ACTION_SETTLE_MS) return
        actionInFlight = true
        // Busy, not disabled: greying the button out until the reply arrives
        // flashes it between its old and new colours. actionInFlight already
        // ignores further clicks.
        $('action-primary').setAttribute('aria-busy', 'true')
        post({
          type: 'action',
          action: currentAction,
          params: getPanelParams(),
        })
      })

      // ----- Mitos hand-off --------------------------------------------------
      // Mitos merges this JSON into its settings on paste. Character dimensions
      // match mitos/app/components/dimension-utils.ts at its base font size.
      const MITOS_CHAR_WIDTH = 7.45
      const MITOS_FONT_SIZE = 12

      function mitosConfig(p) {
        const r4 = (n) => Math.round(n * 10000) / 10000
        // The line height that makes a Mitos character cell the same shape as
        // one grid cell (frameW/cols × frameH/rows). Mitos rederives its export
        // height from width × content aspect, so the pasted export size only
        // holds if this is consistent.
        const lineHeight = r4(
          (p.frameH * p.cols * MITOS_CHAR_WIDTH) / (p.frameW * p.rows * MITOS_FONT_SIZE),
        )
        return {
          mitos: 'grid-config',
          version: 1,
          output: {
            columns: p.cols,
            rows: p.rows,
            // Mitos's aspect field is pixel width over height; with the line
            // height above it is the frame's ratio.
            aspectRatio: r4(
              (p.cols * MITOS_CHAR_WIDTH) / (p.rows * MITOS_FONT_SIZE * lineHeight),
            ),
            useImageAspectRatio: false,
          },
          // Padding must be zero: the grid runs full bleed, so any padding would
          // shrink the cells relative to the frame. Width and height are the
          // export size — the frame's own.
          export: {
            lineHeight: lineHeight,
            padding: 0,
            width: Math.round(p.frameW),
            height: Math.round(p.frameH),
          },
        }
      }

      // navigator.clipboard is unreliable in Figma's iframe. Use a temporary
      // textarea and execCommand from the click handler instead.
      function copyToClipboard(text) {
        const stage = document.createElement('textarea')
        stage.className = 'clipboard-stage'
        stage.value = text
        document.body.appendChild(stage)
        stage.select()
        let ok = false
        try {
          ok = document.execCommand('copy')
        } catch (e) {
          ok = false
        }
        document.body.removeChild(stage)
        return ok
      }

      $('copy-mitos').addEventListener('click', () => {
        if (!lastPreview) return
        const ok = copyToClipboard(JSON.stringify(mitosConfig(lastPreview), null, 2))
        const button = $('copy-mitos')
        button.textContent = ok ? 'Copied' : 'Copy failed'
        button.title = ok ? 'Paste into Mitos' : ''
        clearTimeout(button._resetLabel)
        button._resetLabel = setTimeout(() => {
          button.textContent = 'Copy config'
          button.title = ''
        }, 1600)
      })

      // ----- messages from the plugin ----------------------------------------
      window.addEventListener('message', (event) => {
        const msg = event.data && event.data.pluginMessage
        if (!msg) return

        if (msg.type === 'action-state') {
          const button = $('action-primary')
          if (msg.action !== currentAction) actionChangedAt = Date.now()
          actionInFlight = false
          button.removeAttribute('aria-busy')
          currentAction = msg.action
          button.textContent = msg.actionLabel
          // Remove grids is destructive, so it drops the primary emphasis.
          button.setAttribute('variant', msg.actionDanger ? 'secondary' : 'primary')
          button.toggleAttribute('data-danger', !!msg.actionDanger)
          $('action-status').textContent = msg.status || ''
          $('plugin-root').toggleAttribute('data-live', !!msg.live)
          if (msg.preview) renderPreview(msg.preview)
          reportHeight()
        } else if (msg.type === 'params-change') {
          setPanelParams(msg.params)
        }
      })

      // Live preview of the grid the current params would produce, measured
      // against the selected frame (or the "New frame" params if none).
      function numOr(value, fallback) {
        return typeof value === 'number' ? value : fallback
      }

      function renderPreview(p) {
        lastPreview = p
        const px = (n) => (Math.round(n * 100) / 100).toLocaleString()
        const span = (cls, text) => '<span class="' + cls + '">' + text + '</span>'
        // A bound frame turns the Frame group into a read-only mirror of that
        // frame; with nothing selected it goes back to describing what Create
        // frame would make.
        const nextMirror =
          p.source === 'selection' ? { width: p.frameW, height: p.frameH } : null
        const changed =
          !!nextMirror !== !!mirrored ||
          (nextMirror &&
            (nextMirror.width !== mirrored.width || nextMirror.height !== mirrored.height))
        if (changed) {
          mirrored = nextMirror
          renderFrameFields()
        }

        // The reachable column counts change with the margin, gutter, column
        // count, Pixel snap and its tolerance. Only Manual has them; in Solve
        // the grid is the solver's to choose. With none reachable the grid uses
        // the count it reports, so that becomes the only option.
        if (p.cellLadder && p.cellLadder.length) {
          setCellColumnOptions(p.cellLadder, numOr(p.cellColumns, num('cellColumns')))
        } else if (p.mode !== 'Solve' && typeof p.cellColumns === 'number') {
          setCellColumnOptions([p.cellColumns], p.cellColumns)
        }

        // In Solve, each result is checked against the target that asked for
        // it. Margins are flagged more than a cell off; gutters, which are whole
        // cells, more than half a cell off; the cell count more than 2% off.
        // Compared against the targets the solver used, which differ from the
        // fields when a field is empty or out of range.
        const solving = p.mode === 'Solve'
        const wantCols = numOr(p.targetColumnsUsed, p.targetColumns)
        const colsOff = solving && Math.abs(p.cols - wantCols) > wantCols * 0.02
        const marginOff =
          solving &&
          Math.abs(p.effectiveMargin - numOr(p.targetMarginUsed, p.targetMarginPx)) > p.u
        const gutterOff =
          solving &&
          Math.abs(p.gutterPx - numOr(p.targetGutterUsed, p.targetGutterPx)) >
            p.u / 2 + 1e-6

        // The frame's own size lives in the Frame group, so it isn't repeated.
        $('preview-size').innerHTML =
          (p.columns ? p.columns + ' col ' + span('dim', '&middot;') + ' ' : '') +
          span(colsOff ? 'warn' : '', p.cols + ' &times; ' + p.rows) +
          ' ' +
          span('dim', 'cells')
        const delta = p.deltaPct
        const deltaTxt = (delta > 0 ? '+' : '') + Math.round(delta * 10) / 10 + '%'
        // Show the rounding remainder split between the margins, and flag it
        // when its magnitude exceeds one cell width.
        const bleed = Math.abs(p.hRemainder || 0)
        $('preview-cell').innerHTML =
          px(p.u) +
          ' &times; ' +
          px(p.cellH) +
          'px ' +
          span(p.warn ? 'warn' : 'dim', '(' + deltaTxt + ')') +
          (bleed >= 0.01
            ? ' ' + span(bleed > p.u ? 'warn' : 'dim', '&middot; ' + px(bleed) + 'px bleed')
            : '')

        // Show the derived cell multiples in both modes. Flag aspect deviation
        // above 1%, including deviation allowed by Aspect tol. for pixel snapping.
        $('preview-solved').innerHTML =
          'm' +
          p.solvedM +
          (p.solvedMR !== undefined && p.solvedMR !== p.solvedM ? '/' + p.solvedMR : '') +
          ' k' +
          p.solvedK +
          ' g' +
          p.solvedG +
          ' ' +
          span(p.warn ? 'warn' : 'dim', 'aspect Δ ' + px(Math.abs(p.deltaPct)) + '%')
        lastSpecimens = p.specimens || []
        renderScales()
        // The sans sizes as the optical curve sees them.
        const scale = p.displayScale || 1
        const seen = lastSpecimens
          .filter((s) => s.face === 'sans')
          .map((s) => px(Math.round(s.size * scale)))
        $('preview-display').innerHTML = seen.length
          ? seen.join(' ' + span('dim', '&middot;') + ' ') +
            ' ' +
            span('dim', 'px &middot; &times;' + Math.round(scale * 100) / 100)
          : '—'
        // The margins as drawn, including any bleed from Pixel snap. One column
        // has no gutter to report.
        const marginL = numOr(p.effectiveMargin, p.marginPx)
        const marginR = numOr(p.effectiveMarginRight, p.marginRightPx)
        const margins =
          px(marginL) +
          (marginR !== undefined && Math.abs(marginR - marginL) > 1e-6
            ? '/' + px(marginR)
            : '') +
          'px marg'
        $('preview-column').innerHTML =
          px(p.columnWidth) +
          'px ' +
          span('dim', 'col &middot; ') +
          (p.columns === 1
            ? ''
            : span(gutterOff ? 'warn' : 'dim', px(p.gutterPx) + 'px gut') +
              span('dim', ' &middot; ')) +
          span(marginOff ? 'warn' : 'dim', margins)
      }

      // ----- height reporting ------------------------------------------------
      let rafId = null
      function reportHeight() {
        if (rafId !== null) return
        rafId = requestAnimationFrame(() => {
          rafId = null
          const root = $('plugin-root')
          const height = Math.ceil(root.getBoundingClientRect().height)
          if (height > 0) post({ type: 'resize', height })
        })
      }

      new ResizeObserver(reportHeight).observe($('plugin-root'))
      // Dialogs and popovers mount as body children rather than resizing
      // #plugin-root, so watch the body's child list too.
      new MutationObserver(reportHeight).observe(document.body, {
        childList: true,
      })
      document.addEventListener('openchange', reportHeight)
      applyMode()
      applySnapTol()
      applyEdgeCull()
      FACES.forEach(applyScaleShape)
      renderFrameFields()
      reportHeight()
    </script>
  </body>
</html>
